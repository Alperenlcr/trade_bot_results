name: Update data

# Daily S&P 500 / Nasdaq-100 closes for the performance chart (data/indices/daily.csv)
# and Binance + Bybit AUM / follower counts for the hero follower card (data/binance.json, data/bybit.json).
# Runs after the US close, before the daily trade-results push.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-indices.mjs
        continue-on-error: true
      - run: node scripts/fetch-binance-stats.mjs
        continue-on-error: true
      - run: node scripts/fetch-bybit-stats.mjs # needs Chrome (preinstalled on ubuntu-latest)
        continue-on-error: true
      - run: |
          git diff --quiet data/indices data/binance.json data/bybit.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data/indices/daily.csv data/binance.json data/bybit.json
          git commit -m "Update data: $(date -u +%F)"
          git pull --rebase && git push
